name: Node.js CI
on:
  push:
    branches: [master]
    paths:
      - 'node/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'node/**'
      - '.github/workflows/node-ci.yml'

defaults:
  run:
    working-directory: node

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm test
